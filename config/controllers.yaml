controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    wheel_radius: 0.07625
    chassis_length: 0.4
    chassis_width: 0.4
    velocity_mode: body
    odom_frame: odom
    base_frame: base_link
    pid:
      front_left: {p: 1.0, i: 0.0, d: 0.0}
      front_right: {p: 1.0, i: 0.0, d: 0.0}
      back_left: {p: 1.0, i: 0.0, d: 0.0}
      back_right: {p: 1.0, i: 0.0, d: 0.0}

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50
